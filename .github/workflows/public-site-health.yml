name: Check public site health

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public site source
        uses: actions/checkout@v5

      - name: Validate local HTML links and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          from urllib.parse import unquote, urlparse

          root = Path.cwd().resolve()
          errors = []

          class LinkParser(HTMLParser):
              def __init__(self, source):
                  super().__init__(convert_charrefs=True)
                  self.source = source
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {"href", "src"} and value:
                          self.links.append((name, value))

          ignored_prefixes = ("#", "//", "mailto:", "tel:", "data:", "javascript:")
          for source in root.rglob("*.html"):
              parser = LinkParser(source)
              parser.feed(source.read_text(encoding="utf-8"))
              for attribute, raw in parser.links:
                  value = raw.strip()
                  if not value or value.startswith(ignored_prefixes):
                      continue
                  parsed = urlparse(value)
                  if parsed.scheme:
                      continue
                  relative_path = unquote(parsed.path)
                  if relative_path in {"", "/"}:
                      continue
                  target = (root / relative_path.lstrip("/") if relative_path.startswith("/") else source.parent / relative_path).resolve()
                  if root not in target.parents and target != root:
                      errors.append(f"{source.relative_to(root)}: {attribute}={raw!r} escapes repository")
                  elif not target.is_file():
                      errors.append(f"{source.relative_to(root)}: {attribute}={raw!r} -> {target.relative_to(root) if root in target.parents else target}")

          llms_source = root / "llms.txt"
          for match in re.finditer(r"https://alphaengineerai\.com/[^\s<>()]+", llms_source.read_text(encoding="utf-8")):
              raw = match.group(0).rstrip(".,;)")
              parsed = urlparse(raw)
              relative_path = unquote(parsed.path).lstrip("/") or "index.html"
              target = (root / relative_path).resolve()
              if root not in target.parents and target != root:
                  errors.append(f"llms.txt: URL={raw!r} escapes repository")
              elif not target.is_file():
                  errors.append(f"llms.txt: URL={raw!r} -> {target.relative_to(root) if root in target.parents else target}")

          if errors:
              print("Broken local links or assets found:")
              print("\n".join(sorted(errors)))
              raise SystemExit(1)
          print("All local HTML links and assets resolve.")

      - name: Validate JSON-LD structured data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          class StructuredDataParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_json_ld = False
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and any(name == "type" and value == "application/ld+json" for name, value in attrs):
                      self.in_json_ld = True
                      self.blocks.append("")

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_json_ld:
                      self.in_json_ld = False

              def handle_data(self, data):
                  if self.in_json_ld:
                      self.blocks[-1] += data

          errors = []
          block_count = 0
          for source in Path.cwd().rglob("*.html"):
              parser = StructuredDataParser()
              parser.feed(source.read_text(encoding="utf-8"))
              for block_number, raw in enumerate(parser.blocks, start=1):
                  block_count += 1
                  try:
                      json.loads(raw)
                  except json.JSONDecodeError as error:
                      errors.append(f"{source}:{block_number}: {error}")

          if errors:
              print("Invalid JSON-LD structured data found:")
              print("\n".join(errors))
              raise SystemExit(1)
          print(f"All {block_count} JSON-LD blocks are valid.")

      - name: Validate indexable HTML coverage in sitemaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          from xml.etree import ElementTree as ET

          root = Path.cwd().resolve()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          excluded = {"google27c1c1b7630e0015.html"}

          class RobotsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.noindex = False

              def handle_starttag(self, tag, attrs):
                  if tag != "meta":
                      return
                  values = {name.lower(): (value or "") for name, value in attrs}
                  if values.get("name", "").lower() == "robots" and "noindex" in values.get("content", "").lower():
                      self.noindex = True

          indexable = set()
          for source in root.glob("*.html"):
              if source.name in excluded:
                  continue
              parser = RobotsParser()
              parser.feed(source.read_text(encoding="utf-8"))
              if parser.noindex:
                  continue
              indexable.add("/" if source.name == "index.html" else f"/{source.name}")

          listed = set()
          for sitemap_name in ("sitemap.xml", "core-sitemap.xml"):
              document = ET.parse(root / sitemap_name)
              for loc in document.findall(".//sm:loc", namespace):
                  if not loc.text:
                      continue
                  parsed = urlparse(loc.text.strip())
                  if parsed.netloc != "alphaengineerai.com":
                      raise SystemExit(f"Unexpected sitemap host in {sitemap_name}: {loc.text}")
                  listed.add(parsed.path or "/")

          missing = sorted(indexable - listed)
          if missing:
              print("Indexable HTML pages missing from sitemap.xml or core-sitemap.xml:")
              print("\n".join(missing))
              raise SystemExit(1)
          print(f"All {len(indexable)} indexable HTML pages are covered by the public sitemaps.")
          PY

      - name: Check public pages and discovery files
        shell: bash
        run: |
          set -euo pipefail
          base="https://alphaengineerai.com"
          urls=(
            "$base/"
            "$base/start.html"
            "$base/go.html"
            "$base/global-online-scam-checker.html"
            "$base/community-scam-awareness-toolkit.html"
            "$base/scam-safety-resource-for-organizations.html"
            "$base/global-share-kit.html"
            "$base/global-publisher-kit.html"
            "$base/minddividend-public-resource-badge.svg"
            "$base/guide-directory.html"
            "$base/report-online-scam.html"
            "$base/ai-deepfake-scam-checker.html"
            "$base/investment-scam-checker.html"
            "$base/privacy-and-safety.html"
            "$base/robots.txt"
            "$base/llms.txt"
            "$base/feed.xml"
            "$base/blog-feed.xml"
            "$base/sitemap-index.xml"
            "$base/core-sitemap.xml"
            "$base/sitemap.xml"
          )

          fetch_url() {
            local url="$1"
            local attempt
            local body
            for attempt in 1 2 3 4; do
              if body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"; then
                printf '%s' "$body"
                return 0
              fi
              echo "Attempt $attempt failed for $url; waiting for CDN propagation." >&2
              sleep 5
            done
            echo "Public URL did not become available: $url" >&2
            return 1
          }

          check_url() {
            fetch_url "$1" >/dev/null
          }

          for url in "${urls[@]}"; do
            echo "Checking $url"
            check_url "$url"
          done

          robots="$(fetch_url "$base/robots.txt")"
          grep -Fq "Sitemap: $base/sitemap-index.xml" <<<"$robots"

          home="$(fetch_url "$base/")"
          grep -Fq "MindDividend Shield" <<<"$home"
          ! grep -Fq "Alpha Engineer" <<<"$home"

          organization_resource="$(fetch_url "$base/scam-safety-resource-for-organizations.html")"
          grep -Fq "minddividend-public-resource-badge.svg" <<<"$organization_resource"

          share_kit="$(fetch_url "$base/global-share-kit.html")"
          grep -Fq "Global Scam-Safety Share Kit" <<<"$share_kit"
          grep -Fq "Copy this message" <<<"$share_kit"
          publisher_kit="$(fetch_url "$base/global-publisher-kit.html")"
          grep -Fq "Global Scam-Safety Publisher Kit" <<<"$publisher_kit"
          grep -Fq "Copy badge HTML" <<<"$publisher_kit"
          grep -Fq "publisher_kit_share_click" <<<"$publisher_kit"
          grep -Fq "global_feedback_click" <<<"$publisher_kit"

          social_redirect="$(fetch_url "$base/go.html")"
          grep -Fq "incoming.toString()" <<<"$social_redirect"
          grep -Fq "window.location.replace(target)" <<<"$social_redirect"

          llms="$(fetch_url "$base/llms.txt")"
          grep -Fq "MindDividend Shield" <<<"$llms"
          grep -Fq "Global safety guide directory" <<<"$llms"

          analytics="$(fetch_url "$base/analytics.js")"
          grep -Fq "G-E50HX5K6LP" <<<"$analytics"
          for page in \
            "$base/" \
            "$base/start.html" \
            "$base/global-online-scam-checker.html" \
            "$base/guide-directory.html"; do
            page_html="$(fetch_url "$page")"
            grep -Fq "/analytics.js" <<<"$page_html"
          done

          feed="$(fetch_url "$base/feed.xml")"
          grep -Fq "<rss" <<<"$feed"
          grep -Fq "MindDividend Shield" <<<"$feed"
          required_language_hubs=(
            "common-online-scams.html"
            "estafas-online-comunes.html"
            "golpes-online-comuns.html"
            "arnaques-en-ligne-courantes.html"
            "online-betrugsmaschen.html"
            "online-scam-guide-hi.html"
            "online-scam-guide-ar.html"
            "common-online-scams-zh-hant.html"
            "common-online-scams-id.html"
            "common-online-scams-vi.html"
            "common-online-scams-ja.html"
            "common-online-scams-ko.html"
            "common-online-scams-it.html"
          )
          for language_hub in "${required_language_hubs[@]}"; do
            grep -Fq "$base/$language_hub" <<<"$feed"
          done
          external_feed_links="$(grep -o '<link>[^<]*</link>' <<<"$feed" | sed -e 's#<link>##' -e 's#</link>##' | grep -v "^$base/" || true)"
          if [ -n "$external_feed_links" ]; then
            echo "RSS sitemap contains off-domain item links:" >&2
            echo "$external_feed_links" >&2
            exit 1
          fi

          blog_feed="$(fetch_url "$base/blog-feed.xml")"
          grep -Fq "<rss" <<<"$blog_feed"
          grep -Fq "MindDividend Shield" <<<"$blog_feed"
          for focused_page in \
            "suspicious-link-checker.html" \
            "suspicious-call-checker.html" \
            "qr-code-scam-checker.html" \
            "recovery-scam-checker.html"; do
            grep -Fq "$base/$focused_page" <<<"$blog_feed"
          done

          index="$(fetch_url "$base/sitemap-index.xml")"
          grep -Fq "$base/core-sitemap.xml" <<<"$index"
          grep -Fq "$base/sitemap.xml" <<<"$index"

          INDEX_XML="$index" python - <<'PY'
          import os
          from datetime import datetime
          from urllib.request import urlopen
          from xml.etree import ElementTree as ET

          base = "https://alphaengineerai.com"
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          index_root = ET.fromstring(os.environ["INDEX_XML"])

          for sitemap in index_root.findall("sm:sitemap", namespace):
              location = sitemap.findtext("sm:loc", namespaces=namespace)
              declared = sitemap.findtext("sm:lastmod", namespaces=namespace)
              if not location or not declared:
                  raise SystemExit("Sitemap index entry is missing loc or lastmod.")
              if not location.startswith(base + "/"):
                  raise SystemExit(f"Unexpected sitemap host: {location}")
              child_root = ET.fromstring(urlopen(location, timeout=30).read())
              child_dates = [
                  node.text for node in child_root.findall(".//sm:lastmod", namespace)
                  if node.text
              ]
              if not child_dates:
                  raise SystemExit(f"Child sitemap has no lastmod values: {location}")
              latest = max(datetime.fromisoformat(value) for value in child_dates)
              if datetime.fromisoformat(declared) != latest:
                  raise SystemExit(
                      f"Sitemap index lastmod is stale for {location}: "
                      f"declared={declared}, latest={latest.isoformat()}"
                  )
              print(f"Sitemap index lastmod matches {location}: {declared}")
          PY

          for sitemap in "$base/core-sitemap.xml" "$base/sitemap.xml"; do
            sitemap_xml="$(fetch_url "$sitemap")"
            if grep -Fq "$base/blog/" <<<"$sitemap_xml"; then
              echo "Legacy blog content must not enter the public MindDividend Shield sitemap: $sitemap" >&2
              exit 1
            fi
            sitemap_urls="$(grep -o '<loc>[^<]*</loc>' <<<"$sitemap_xml" | sed -e 's#<loc>##' -e 's#</loc>##')"
            while IFS= read -r page_url; do
              [ -z "$page_url" ] && continue
              echo "Checking sitemap page $page_url"
              check_url "$page_url"
              page_html="$(fetch_url "$page_url")"
              grep -Fq "MindDividend Shield" <<<"$page_html"
              if grep -Fqi "noindex" <<<"$page_html"; then
                echo "Unexpected noindex directive on $page_url" >&2
                exit 1
              fi
              grep -Fq 'rel="canonical"' <<<"$page_html"
            done <<<"$sitemap_urls"
          done

          echo "Public site health checks passed."
