name: Submit public URLs to IndexNow

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public site map
        uses: actions/checkout@v4

      - name: Submit the current sitemap to IndexNow
        shell: pwsh
        run: ./tools/submit-indexnow.ps1
